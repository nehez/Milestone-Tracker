name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment's branch policy only permits
    # claude/milestone-tracker-excel-3oy2ab (it was the default branch when Pages
    # was enabled, and that policy is stored by name, so switching the default
    # branch to main didn't update it). Deploys from main are rejected at the
    # environment gate before any step runs — and worse, since this workflow
    # shares one concurrency group, a losing main run would cancel an
    # in-progress (successful) run from this branch if it landed second. Only
    # trigger from the branch that can actually deploy. Add main back once the
    # environment's Deployment branches list is updated to allow it.
    branches: [claude/milestone-tracker-excel-3oy2ab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
