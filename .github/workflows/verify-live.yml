name: Verify live site content

# Temporary: confirms the deployed Pages site actually reflects the latest
# commit (this session's egress proxy blocks github.io directly). Delete
# once confirmed.
on:
  push:
    branches: [claude/milestone-tracker-excel-3oy2ab]
    paths:
      - ".github/workflows/verify-live.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site and its bundled JS
        run: |
          curl -s https://nehez.github.io/Milestone-Tracker/ -o index.html
          echo "--- index.html ---"
          cat index.html
          asset=$(grep -o '/Milestone-Tracker/assets/index-[A-Za-z0-9_-]*\.js' index.html | head -1)
          echo "asset: $asset"
          curl -s "https://nehez.github.io${asset}" -o bundle.js
          echo "--- version string present? ---"
          grep -o '0\.[0-9]\+\.[0-9]\+' bundle.js | sort -u | head -5
          echo "--- feature strings present? ---"
          grep -q "showMovement" bundle.js && echo "showMovement: YES" || echo "showMovement: NO"
          grep -q "Manage milestones" bundle.js && echo "Manage milestones: YES" || echo "Manage milestones: NO"
